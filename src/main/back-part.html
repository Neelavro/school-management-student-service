<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ID Card Back</title>

    <style>

        *{
          box-sizing:border-box;
          margin:0;
          padding:0;
          font-family: Arial, Helvetica, sans-serif;
        }

        body{
          background:#e6e6e6;
          display:flex;
          justify-content:center;
          align-items:center;
          height:100vh;
        }

        /* Card */
        .card{
          width:190px;
          height:300px;
          background:#f5f5f5;
          border:4px solid #3b6ee8;
          display:flex;
          flex-direction:column;
          text-align:center;
        }

        /* Top section */
        .top{
          padding:10px 8px;
        }

        .top-text{
          font-weight:bold;
          font-size:16px;
          line-height:1.2;
          margin-bottom:8px;
        }

        /* Logo */
        .logo{
          width:90px;
          margin:auto;
          display:block;
        }

        /* Blue school bar */
        .school-bar{
          background:#3b6ee8;
          color:white;
          font-weight:bold;
          font-size:14px;
          padding:10px 6px;
          line-height:1.2;
        }

        /* Bottom info */
        .info{
          padding:12px 8px;
          font-weight:bold;
          font-size:12px;
          line-height:1.5;
        }

        .email{
          font-size:11px;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="top">
        <div class="top-text">
            If Found, Please<br>
            Return to the
        </div>

    </div>

    <div class="school-bar">
        LUTFUR RAHMAN DAKHIL<br>
        (CADET) MADRASAH
    </div>

    <div class="info">
        LUTFUR RAHMAN ROAD, NATULLABAD,<br>
        01913520581<br>
        <span class="email">
      lutfurrahmanmodelmadrasah2003@gmail.
    </span>
    </div>

</div>

</body>
</html>
